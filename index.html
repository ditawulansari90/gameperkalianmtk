<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Perkalian 6 - 8</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    body { font-family: 'Arial', sans-serif; background-color: #f0f8ff; text-align: center; padding: 20px; }
    .card { background: white; max-width: 500px; margin: 0 auto; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .timer { font-size: 20px; color: #d9534f; font-weight: bold; margin: 10px 0; }
    .question { font-size: 36px; font-weight: bold; color: #333; margin: 20px 0; }
    input[type="number"], input[type="text"] { font-size: 18px; padding: 10px; width: 80%; border: 2px solid #ddd; border-radius: 8px; text-align: center; }
    button { background-color: #4CAF50; color: white; border: none; padding: 12px 25px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    button:hover { background-color: #45a049; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <!-- Halaman Awal -->
  <div id="start-screen">
    <h2>Game Perkalian 6 - 8</h2>
    <p>Masukkan nama siswa sebelum memulai:</p>
    <input type="text" id="student-name" placeholder="Nama Lengkap Siswa" required><br>
    <button onclick="startGame()">Mulai Kuis</button>
  </div>

  <!-- Halaman Kuis -->
  <div id="quiz-screen" class="hidden">
    <div id="progress">Soal 1 dari 10</div>
    <div class="timer">Sisa Waktu: <span id="time-left">35</span> detik</div>
    <div class="question" id="question-text">6 x 7</div>
    <input type="number" id="answer-input" placeholder="Jawaban" autofocus><br>
    <button onclick="submitAnswer()">Jawab</button>
  </div>

  <!-- Halaman Hasil -->
  <div id="result-screen" class="hidden">
    <h2>Kuis Selesai!</h2>
    <p>Siswa: <strong id="res-name"></strong></p>
    <h3>Skor Anda: <span id="res-score"></span> / 100</h3>
    <button onclick="sendToTeacher()" id="btn-send">Kirim ke akun guru</button>
    <p id="status-msg" style="margin-top: 15px; font-weight: bold;"></p>
  </div>
</div>

<script>
  // =========================================================
  // KODE RAHASIA EMAILJS BU DITA
  // =========================================================
  const PUBLIC_KEY = "0icbHDWAtrbQxSeEk"; // Tinggal ganti ini saja!
  const SERVICE_ID = "service_6b85k7p";
  const TEMPLATE_ID = "zz3caic";

  emailjs.init(PUBLIC_KEY); 

  const TEACHER_EMAIL = "ditawulansari90@gmail.com";
  let questions = [];
  let currentQ = 0;
  let score = 0;
  let timer;
  let timeLeft = 35;
  let studentName = "";
  let userAnswers = [];

  function generateQuestions() {
    let list = [];
    for (let i = 0; i < 10; i++) {
      let num1 = Math.floor(Math.random() * 3) + 6;
      let num2 = Math.floor(Math.random() * 10) + 1;
      list.push({ n1: num1, n2: num2, ans: num1 * num2 });
    }
    return list;
  }

  function startGame() {
    studentName = document.getElementById('student-name').value;
    if (!studentName.trim()) {
      alert("Harap masukkan nama terlebih dahulu!");
      return;
    }
    questions = generateQuestions();
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');
    showQuestion();
  }

  function showQuestion() {
    if (currentQ >= 10) {
      endGame();
      return;
    }
    document.getElementById('progress').innerText = `Soal ${currentQ + 1} dari 10`;
    document.getElementById('question-text').innerText = `${questions[currentQ].n1} x ${questions[currentQ].n2}`;
    document.getElementById('answer-input').value = '';
    
    clearInterval(timer);
    timeLeft = 35;
    document.getElementById('time-left').innerText = timeLeft;
    
    timer = setInterval(() => {
      timeLeft--;
      document.getElementById('time-left').innerText = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(timer);
        recordAnswer(null);
      }
    }, 1000);
  }

  function submitAnswer() {
    let val = document.getElementById('answer-input').value;
    if (val === "") return;
    clearInterval(timer);
    recordAnswer(parseInt(val));
  }

  function recordAnswer(ans) {
    let correct = questions[currentQ].ans;
    let isCorrect = (ans === correct);
    if (isCorrect) score += 10;

    userAnswers.push({
      soal: `${questions[currentQ].n1} x ${questions[currentQ].n2}`,
      jawabanSiswa: ans !== null ? ans : "Waktu Habis",
      jawabanBenar: correct,
      status: isCorrect ? "Benar" : "Salah"
    });

    currentQ++;
    showQuestion();
  }

  function endGame() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('res-name').innerText = studentName;
    document.getElementById('res-score').innerText = score;
  }

  function sendToTeacher() {
    const btn = document.getElementById('btn-send');
    const statusMsg = document.getElementById('status-msg');
    btn.disabled = true;
    statusMsg.innerText = "Sedang mengirim laporan ke email guru...";

    let ringkasanJawaban = "";
    userAnswers.forEach((item, index) => {
      ringkasanJawaban += `${index + 1}. ${item.soal} | Jwb Siswa: ${item.jawabanSiswa} | Jawaban Benar: ${item.jawabanBenar} (${item.status})\n`;
    });

    const templateParams = {
      to_email: TEACHER_EMAIL,
      student_name: studentName,
      score: score,
      quiz_details: ringkasanJawaban
    };

    emailjs.send(SERVICE_ID, TEMPLATE_ID, templateParams)
      .then(function() {
         statusMsg.style.color = "green";
         statusMsg.innerText = `Berhasil! Laporan kuis telah dikirim ke ${TEACHER_EMAIL}`;
      }, function(error) {
         statusMsg.style.color = "red";
         statusMsg.innerText = "Gagal mengirim. Periksa Public Key atau koneksi internet Anda.";
         btn.disabled = false;
      });
  }
</script>

</body>
</html>
<!-- Form Pengiriman Hasil Tugas ke Guru -->
<div id="form-kirim-nilai" style="max-width: 400px; margin: 20px auto; padding: 20px; border: 2px solid #4CAF50; border-radius: 10px; font-family: Arial, sans-serif; background-color: #f9f9f9; text-align: center;">
  <h3 style="color: #333;">Kirim Hasil Tugas ke Guru</h3>
  
  <label style="display:block; margin-bottom: 5px; text-align: left; font-weight: bold;">Pilih Nama / Absen Siswa:</label>
  <select id="selectSiswa" style="width: 100%; padding: 8px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">
    <option value="">-- Muat Daftar Siswa... --</option>
  </select>

  <label style="display:block; margin-bottom: 5px; text-align: left; font-weight: bold;">Mata Pelajaran:</label>
  <input type="text" id="inputMapel" value="IPA" placeholder="Contoh: IPA" style="width: 95%; padding: 8px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

  <label style="display:block; margin-bottom: 5px; text-align: left; font-weight: bold;">Nama Tugas / Game:</label>
  <input type="text" id="inputTugas" value="Kuis Ekosistem" placeholder="Contoh: Kuis Ekosistem" style="width: 95%; padding: 8px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

  <label style="display:block; margin-bottom: 5px; text-align: left; font-weight: bold;">Nilai / Skor:</label>
  <input type="number" id="inputNilai" placeholder="Masukkan Skor (misal: 100)" style="width: 95%; padding: 8px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

  <button onclick="kirimNilaiKeGuru()" id="btnKirim" style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold;">
    🚀 Kirim Laporan ke Guru
  </button>

  <p id="statusKirim" style="margin-top: 15px; font-weight: bold;"></p>
</div>

<script>
  // Link Web App Google Apps Script Anda
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXZQcWGKAYLbz9X9O2_-Qs4mIlvtf9M0xlMa-0ZwxuRBmoE9dhjmXDyGjEUAxMpEHe/exec";

  // Memuat daftar siswa otomatis dari Google Sheets saat halaman dibuka
  window.onload = function() {
    fetch(SCRIPT_URL)
      .then(response => response.json())
      .then(data => {
        const select = document.getElementById("selectSiswa");
        select.innerHTML = '<option value="">-- Pilih Nama Siswa --</option>';
        data.forEach(siswa => {
          if (siswa.namaSiswa) {
            let option = document.createElement("option");
            option.value = JSON.stringify({ absen: siswa.nomorAbsen, nama: siswa.namaSiswa });
            option.text = `${siswa.nomorAbsen}. ${siswa.namaSiswa}`;
            select.appendChild(option);
          }
        });
      })
      .catch(err => {
        console.error("Gagal memuat daftar siswa:", err);
        document.getElementById("selectSiswa").innerHTML = '<option value="">-- Gagal memuat daftar --</option>';
      });
  };

  // Fungsi untuk mengirim data nilai ke Google Sheets
  function kirimNilaiKeGuru() {
    const selectSiswaValue = document.getElementById("selectSiswa").value;
    const mapel = document.getElementById("inputMapel").value;
    const tugas = document.getElementById("inputTugas").value;
    const nilai = document.getElementById("inputNilai").value;
    const statusText = document.getElementById("statusKirim");
    const btnKirim = document.getElementById("btnKirim");

    if (!selectSiswaValue) {
      alert("Silakan pilih nama siswa terlebih dahulu!");
      return;
    }
    if (!nilai) {
      alert("Silakan isi nilai/skor terlebih dahulu!");
      return;
    }

    const siswaData = JSON.parse(selectSiswaValue);

    statusText.style.color = "blue";
    statusText.innerText = "Sedang mengirim data...";
    btnKirim.disabled = true;

    const payload = {
      nomorAbsen: siswaData.absen,
      namaSiswa: siswaData.nama,
      mataPelajaran: mapel,
      namaTugas: tugas,
      nilai: parseInt(nilai)
    };

    fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      statusText.style.color = "green";
      statusText.innerText = "✅ Berhasil! Nilai Anda sudah tersimpan di akun guru.";
      document.getElementById("inputNilai").value = "";
      btnKirim.disabled = false;
    })
    .catch(err => {
      console.error(err);
      statusText.style.color = "red";
      statusText.innerText = "❌ Gagal mengirim. Coba lagi.";
      btnKirim.disabled = false;
    });
  }
</script>
